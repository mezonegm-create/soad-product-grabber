<!doctype html>
<html>
<head>
  <title>Handmade Ceramic Mug &ndash; Pottery Barnhouse</title>
</head>
<body>
  <header class="site-header">
    <div class="site-branding">
      <img class="custom-logo" src="/wp-content/uploads/2023/logo-pottery-barnhouse.png" alt="Pottery Barnhouse logo" width="240" height="60" />
    </div>
  </header>

  <div class="woocommerce-product-gallery">
    <div class="woocommerce-product-gallery__wrapper">
      <div class="woocommerce-product-gallery__image">
        <a href="https://shop.example.com/wp-content/uploads/2023/mug-full.jpg">
          <img
            src="https://shop.example.com/wp-content/uploads/2023/mug-full-300x300.jpg"
            class="wp-post-image"
            data-large_image="https://shop.example.com/wp-content/uploads/2023/mug-full.jpg"
            data-large_image_width="1600"
            data-large_image_height="1600"
            alt="Ceramic mug"
          />
        </a>
      </div>
      <div class="woocommerce-product-gallery__image">
        <a href="https://shop.example.com/wp-content/uploads/2023/mug-handle.jpg">
          <img
            src="https://shop.example.com/wp-content/uploads/2023/mug-handle-300x300.jpg"
            class="wp-post-image"
            data-large_image="https://shop.example.com/wp-content/uploads/2023/mug-handle.jpg"
            data-large_image_width="1600"
            data-large_image_height="1600"
            alt="Ceramic mug handle detail"
          />
        </a>
      </div>
    </div>
  </div>

  <div class="related products">
    <img src="https://shop.example.com/wp-content/uploads/2023/other-item-150x150.jpg" alt="related product" />
  </div>
</body>
</html>
