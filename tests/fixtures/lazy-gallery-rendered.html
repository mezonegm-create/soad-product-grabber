<!doctype html>
<html>
<head>
  <title>Oak Dining Table</title>
</head>
<body>
  <header class="header">
    <img src="https://cdn.furnitureco.example.com/branding/brand-mark.png" alt="FurnitureCo" />
  </header>

  <main>
    <h1>Oak Dining Table</h1>
    <!-- Post-hydration DOM: the lazy-loading library has already swapped
         data-src -> src for every image that scrolled into view (the
         browser-render fallback scrolls the page specifically to trigger
         this before capturing page.content()). -->
    <div class="product-media-carousel">
      <img src="https://cdn.furnitureco.example.com/products/oak-table/full-1.jpg" alt="Oak dining table" width="1400" height="1400" />
      <img src="https://cdn.furnitureco.example.com/products/oak-table/full-2.jpg" alt="Oak dining table detail" width="1400" height="1400" />
    </div>
  </main>
</body>
</html>
