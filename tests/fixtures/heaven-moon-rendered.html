<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <title>عطر القمر - Heaven Moon</title>
  <meta property="og:image" content="https://cdn.heaven-moon.example.com/branding/logo.jpg" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": "عطر القمر",
      "image": ["https://cdn.heaven-moon.example.com/branding/logo-social-share.jpg"]
    }
  </script>
</head>
<body>
  <header class="site-header">
    <img src="https://cdn.heaven-moon.example.com/branding/logo.jpg" alt="Heaven Moon logo" />
  </header>

  <main>
    <h1 class="product-title">عطر القمر</h1>
    <!-- What the DOM looks like once client-side JS has hydrated the
         gallery component and populated it with the real product photos --
         exactly what a headless-browser render (after scrolling to trigger
         any lazy loading) would capture via page.content(). -->
    <div id="product-gallery" class="product-gallery" data-product-id="8842">
      <img src="https://cdn.heaven-moon.example.com/products/8842/bottle-front.jpg" alt="عطر القمر - المنظر الأمامي" width="1200" height="1200" />
      <img src="https://cdn.heaven-moon.example.com/products/8842/bottle-box.jpg" alt="عطر القمر - العلبة" width="1200" height="1200" />
      <img src="https://cdn.heaven-moon.example.com/products/8842/bottle-side.jpg" alt="عطر القمر - الجانب" width="1200" height="1200" />
    </div>
  </main>
</body>
</html>
